name: CT Campeador TEST - autoresultados 15 min
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar EXCLUSIVAMENTE recursos TEST
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYVALIDATE'
          import os, pathlib, tomllib, datetime
          if os.environ['REPO'].lower() != 'ligasdetenis/ct-campeador-pruebas':
              raise SystemExit('BLOQUEADO: no es el repositorio TEST')
          p=pathlib.Path('API_WORKER_TEST/wrangler.autoresultados-test.toml')
          s=pathlib.Path('API_WORKER_TEST/src/index.js')
          if not p.is_file() or not s.is_file():
              raise SystemExit('BLOQUEADO: faltan archivos dentro de API_WORKER_TEST')
          data=tomllib.loads(p.read_text(encoding='utf8'))
          if data.get('name')!='ct-campeador-api-test' or data.get('main')!='src/index.js':
              raise SystemExit('BLOQUEADO: nombre/entrada del Worker TEST no coinciden')
          if not any(x.get('binding')=='DATA' and x.get('id')=='a2f070ff119f45028d759f8aea51c7bd' for x in data.get('kv_namespaces',[])):
              raise SystemExit('BLOQUEADO: KV incorrecto, no se puede desplegar')
          if not any(x.get('binding')=='PUSH_SERVICE' and x.get('service')=='campeador-push-test' for x in data.get('services',[])):
              raise SystemExit('BLOQUEADO: Push incorrecto')
          if not any(x.get('name')=='BOOKINGS' and x.get('class_name')=='BookingCoordinator' for x in data.get('durable_objects',{}).get('bindings',[])):
              raise SystemExit('BLOQUEADO: BookingCoordinator no configurado')
          if 'testAutoConfirmExpiredResults' not in s.read_text(encoding='utf8'):
              raise SystemExit('BLOQUEADO: código de confirmación automática ausente')
          if data.get('triggers',{}).get('crons')!=['*/5 * * * *']:
              raise SystemExit('BLOQUEADO: falta la comprobación cada 5 minutos')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          content=p.read_text(encoding='utf8')
          old='TEST_AUTO_CONFIRM_NOT_BEFORE = "2099-01-01T00:00:00Z"'
          if old not in content:
              raise SystemExit('BLOQUEADO: falta marcador de seguridad de inicio TEST')
          p.write_text(content.replace(old, f'TEST_AUTO_CONFIRM_NOT_BEFORE = "{now}"'),encoding='utf8')
          print('VALIDADO: API_WORKER_TEST / KV TEST / PUSH TEST. Activación:',now)
          PYVALIDATE
      - name: Comprobar sintaxis JavaScript
        run: node --check API_WORKER_TEST/src/index.js
      - name: Preparar Wrangler
        run: npm install --no-save wrangler@4
      - name: Desplegar únicamente API TEST
        working-directory: API_WORKER_TEST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ./wrangler.autoresultados-test.toml
