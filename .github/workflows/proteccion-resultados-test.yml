name: CT Campeador TEST - proteccion resultados V3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-proteccion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar recursos exclusivos TEST
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYVALIDATE'
          import os, pathlib, tomllib, datetime
          if os.environ['REPO'].lower() != 'ligasdetenis/ct-campeador-pruebas':
              raise SystemExit('ERROR: NO ES EL REPOSITORIO TEST. Nada desplegado.')
          p=pathlib.Path('API_WORKER_TEST/wrangler.proteccion-test.toml')
          js=pathlib.Path('API_WORKER_TEST/src/index.js')
          if not p.is_file() or not js.is_file(): raise SystemExit('Faltan archivos de TEST')
          cfg=tomllib.loads(p.read_text('utf8'))
          if cfg.get('name')!='ct-campeador-api-test': raise SystemExit('Destino no es TEST')
          if not any(k.get('id')=='a2f070ff119f45028d759f8aea51c7bd' for k in cfg.get('kv_namespaces',[])): raise SystemExit('KV no es TEST')
          if not any(k.get('service')=='campeador-push-test' for k in cfg.get('services',[])): raise SystemExit('Push no es TEST')
          if cfg.get('triggers',{}).get('crons') != ['*/5 * * * *']: raise SystemExit('Cron distinto')
          code=js.read_text('utf8')
          for key in ['leagueRead','leagueWrite','leagueExpire','resultStorageHealth','AUTORESULTS_WAIT_MS = 24 * 60 * 60 * 1000']:
              if key not in code: raise SystemExit('Falta '+key)
          marker='AUTORESULTS_NOT_BEFORE = "2099-01-01T00:00:00Z"'
          s=p.read_text('utf8')
          if marker not in s: raise SystemExit('Falta fecha de seguridad: no despliego')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          p.write_text(s.replace(marker,'AUTORESULTS_NOT_BEFORE = "'+now+'"'),'utf8')
          print('TEST autorizado. Fecha corte:',now)
          PYVALIDATE
      - name: Validar sintaxis
        run: node --check API_WORKER_TEST/src/index.js
      - name: Instalar Wrangler
        run: npm install --no-save wrangler@4
      - name: Desplegar EXCLUSIVAMENTE TEST
        working-directory: API_WORKER_TEST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.proteccion-test.toml
