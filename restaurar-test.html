<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar copia · TEST</title>
<style>
body{font-family:system-ui;margin:0;background:#11151b;color:#f5f7fa}.box{max-width:720px;margin:40px auto;padding:24px;background:#1b222c;border:1px solid #364150;border-radius:18px}.warn{background:#3a220b;border:1px solid #925b19;padding:12px;border-radius:12px;margin:15px 0}label{display:block;margin:14px 0 6px;font-weight:700}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #536173;background:#0f141a;color:#fff}button{margin-top:18px;background:#d71920;border:0;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;background:#0f141a;padding:12px;border-radius:10px;min-height:70px}.ok{color:#80e59d}.bad{color:#ff9a9a}
</style>
</head>
<body>
<div class="box">
<h1>🧪 Restaurar copia en TEST</h1>
<div class="warn"><b>Solo entorno de pruebas.</b> Esta página envía la copia directamente a <code>ct-campeador-api-test</code>. No la sube a GitHub.</div>
<label>Copia de seguridad JSON</label><input id="file" type="file" accept="application/json,.json">
<label>RESTORE_TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="Pega el token temporal">
<button id="go" type="button">Restaurar en TEST</button>
<pre id="out">Esperando…</pre>
</div>
<script>
const API='https://ct-campeador-api-test.ligasdetenis.workers.dev/';
const out=document.getElementById('out');
document.getElementById('go').addEventListener('click', async()=>{
  const f=document.getElementById('file').files[0];
  const token=document.getElementById('token').value.trim();
  if(!f||!token){out.textContent='Selecciona el JSON y escribe el RESTORE_TOKEN.';out.className='bad';return;}
  try{
    out.textContent='Restaurando…';out.className='';
    const backup=JSON.parse(await f.text());
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'restoreBackupTest',backup})});
    const text=await r.text();
    let j={}; try{j=JSON.parse(text)}catch(_){ }
    if(!r.ok||j.ok===false) throw new Error(j.error||text||('HTTP '+r.status));
    out.textContent='✅ RESTAURACIÓN TEST COMPLETADA\n\n'+JSON.stringify(j.restored||j,null,2)+'\n\nYa puedes cerrar esta página.';
    out.className='ok';
  }catch(e){out.textContent='❌ '+(e.message||String(e));out.className='bad';}
});
</script>
</body>
</html>
